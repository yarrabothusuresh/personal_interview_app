<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1080" viewBox="0 0 1000 1080" role="img" aria-label="InterviewPrep AI | Implemented User Flow"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172554}.title{font-size:26px;font-weight:bold}.label{font-size:16px;font-weight:bold}.note{font-size:13px;fill:#475569}</style><text x="32" y="43" class="title">InterviewPrep AI | Implemented User Flow</text><text x="32" y="73" class="note">Internal navigation retains the session. Refreshing or closing the tab clears reports.</text><rect x="340" y="110" width="320" height="76" rx="12" fill="#e0e7ff" stroke="#a5b4fc"/><text x="500" y="139" text-anchor="middle" class="label">Home and resume form</text><text x="500" y="162" text-anchor="middle" class="note">Resume + JD + role + experience</text><rect x="30" y="110" width="230" height="76" rx="12" fill="#dcfce7" stroke="#a5b4fc"/><text x="145" y="139" text-anchor="middle" class="label">Sample preview</text><text x="145" y="162" text-anchor="middle" class="note">12 curated questions, no AI</text><path d="M340,148 L260,148" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="340" y="240" width="320" height="76" rx="12" fill="#e0e7ff" stroke="#a5b4fc"/><text x="500" y="269" text-anchor="middle" class="label">Validate and analyze</text><text x="500" y="292" text-anchor="middle" class="note">Upload → parser → Gemini → Zod</text><path d="M500,186 L500,240" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="720" y="240" width="250" height="76" rx="12" fill="#fef3c7" stroke="#a5b4fc"/><text x="845" y="269" text-anchor="middle" class="label">Correct or retry</text><text x="845" y="292" text-anchor="middle" class="note">Invalid input / provider failure</text><path d="M660,278 L720,278" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="340" y="370" width="320" height="76" rx="12" fill="#e0e7ff" stroke="#a5b4fc"/><text x="500" y="399" text-anchor="middle" class="label">Free analysis</text><text x="500" y="422" text-anchor="middle" class="note">Score, skills, gaps, 5 sample Q&amp;As</text><path d="M500,316 L500,370" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="340" y="500" width="320" height="76" rx="12" fill="#e0e7ff" stroke="#a5b4fc"/><text x="500" y="529" text-anchor="middle" class="label">Full pack page</text><text x="500" y="552" text-anchor="middle" class="note">Load configuration; retry if needed</text><path d="M500,446 L500,500" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="635" width="300" height="76" rx="12" fill="#dcfce7" stroke="#a5b4fc"/><text x="180" y="664" text-anchor="middle" class="label">Premium disabled</text><text x="180" y="687" text-anchor="middle" class="note">Generate without payment</text><rect x="650" y="635" width="320" height="76" rx="12" fill="#fef3c7" stroke="#a5b4fc"/><text x="810" y="664" text-anchor="middle" class="label">Premium enabled</text><text x="810" y="687" text-anchor="middle" class="note">Pay → operator verifies → enter code</text><path d="M420,576 L180,635" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M580,576 L810,635" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="340" y="785" width="320" height="76" rx="12" fill="#e0e7ff" stroke="#a5b4fc"/><text x="500" y="814" text-anchor="middle" class="label">Generate full report</text><text x="500" y="837" text-anchor="middle" class="note">Server checks code when required</text><path d="M180,711 L390,785" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M810,711 L610,785" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="340" y="925" width="320" height="76" rx="12" fill="#dcfce7" stroke="#a5b4fc"/><text x="500" y="954" text-anchor="middle" class="label">Study and download</text><text x="500" y="977" text-anchor="middle" class="note">Filter, search, answers, plan, PDF</text><path d="M500,861 L500,925" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="32" y="1045" class="note">Invalid code or generation failure: show a recovery message and allow another attempt within the rate limit.</text></svg>